<body>

  <div id="boot" style="font-family:system-ui,Arial,sans-serif;color:#4a1c30;text-align:center;padding:48px 20px;direction:rtl">
    <div style="font-size:22px;font-weight:700">ורד מלאכי</div>
    <div style="margin-top:6px">יופי מבחוץ · צמיחה מבפנים</div>
    <style>@keyframes vm-spin{to{transform:rotate(360deg)}}</style>
    <div aria-hidden="true" style="margin:28px auto 0;width:44px;height:44px;border-radius:50%;border:4px solid #ecdcc0;border-top-color:#b08a3e;animation:vm-spin 1s linear infinite"></div>
    <p id="boot-progress" style="margin-top:12px;font-size:20px;font-weight:700"></p>
    <p id="boot-text" style="margin-top:12px">טוענת את המערכת… בפעם הראשונה זה יכול לקחת עד חצי דקה.</p>
    <p id="boot-hint" style="margin-top:16px;font-size:14px;display:none">לוקח יותר מדי זמן? כדאי לפתוח את הקישור בדפדפן עצמו (ספארי באייפון, כרום באנדרואיד) ולא בתוך וואטסאפ.</p>
  </div>
  <script>setTimeout(function () { var h = document.getElementById("boot-hint"); if (h) h.style.display = "block"; }, 15000);</script>
  <div id="root"></div>
  <script>
    window.addEventListener("error", function (e) {
      var t = document.getElementById("boot-text");
      if (t) t.textContent = "שגיאה: " + (e.message || "");
    });
  </script>

<script>
(function () {
  var p = document.getElementById("boot-progress"), TOTAL = 8193308;
  function run(code) { var s = document.createElement("script"); s.type = "module"; s.textContent = code; document.body.appendChild(s); }
  function fallback() { var s = document.createElement("script"); s.type = "module"; s.src = "app.js"; document.body.appendChild(s); }
  fetch("app.js").then(function (r) {
    if (!r.ok || !r.body || !window.TextDecoder) return r.text().then(run);
    var reader = r.body.getReader(), dec = new TextDecoder(), got = 0, parts = [];
    return (function pump() {
      return reader.read().then(function (x) {
        if (x.done) { parts.push(dec.decode()); if (p) p.textContent = "100%"; run(parts.join("")); return; }
        got += x.value.length; parts.push(dec.decode(x.value, { stream: true }));
        if (p) p.textContent = Math.min(99, Math.round(got * 100 / TOTAL)) + "%";
        return pump();
      });
    })();
  }).catch(fallback);
})();
</script>
</body>
